<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css' integrity='sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==' crossorigin='anonymous'/>
</head>
<body>
    <header>
        <h1>Olx</h1>
    </header>
    <div class="wrapper"></div>
    <div class="modal">
        <form>
            <button class="close">X</button>
            <h2>Add new AD</h2>
            <label for="title">Title</label>
            <input type="text" name="title" required>

            <label for="image" class="upload"><i class="fa-solid fa-cloud-arrow-up"></i>Upload Image</label>
            <input type="file" name="image" id="image" multiple accept="image/*">

            <label for="description">Description</label>
            <textarea name="description"></textarea>
            <button class="add-button">+</button>
        </form>
    </div>
    <button class="open">+</button>
</body>
</html>
